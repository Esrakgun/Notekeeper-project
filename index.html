<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Css Link Bağlantı Noktası -->
    <link rel="stylesheet" href="./style.css">
    <!-- Box Icons Link Bağlantı Noktası -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>NoteKeeper</title>
</head>
<body>
    <!-- !Wrapper Başlangiç -->
     <div class="wrapper">
        <!-- !Ekleme Alanı -->
         <li class="add-box">
            <div class="icon">
                <i class='bx bx-plus'></i>
            </div>
             <p>Add New Note</p>
         </li>
         <li class="note">
            <div class="details">
                <p  class="title">Not Başlık</p>
                <p class="description">Note Açıklama</p>
            </div>
            <!-- Bottom Alanı -->
             <div class="bottom-content">
                <span>January 11 ,2025</span>
                <div class="settings">
                   <i class='bx bx-dots-horizontal-rounded'></i>
                    <ul class="menu">
                        <li><i class='bx bx-edit'></i>Düzenle</li>
                        <li><i class='bx bx-trash'></i>Sil</li>
                    </ul>
                </div>
             </div>
         </li>
     </div>

     <!-- !Modal Başlangiç -->
      <div class="popup-box">
              <div class="popup">
                <div class="content">
                    <!-- Header Alanı -->
                    <header>
                        <p>New Not</p>
                        <i class='bx bx-x'></i>
                    </header>
                    <!-- Form Kısmı  -->
                     <form>
                        <!-- Title -->
                        <div class="row title">
                            <label>Title</label>
                            <input type="text">
                        </div>
                         <!-- Description -->
                        <div class="row description">
                            <label>Description</label>
                            <textarea></textarea>
                        </div>
                        <button id="submit-btn"   type="submit">Add Note</button>
                     </form>
                </div>
              </div>
      </div>

    <!-- Js Link Bağlantı Noktası -->
    <script src="./main.js"></script>
</body>
</html>
